# Configuraci\u00F3n de Base de Datos
spring.datasource.url=jdbc:postgresql://ep-cool-wind-apqfs6tm-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# Configuraci\u00F3n de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Variables de la IA y Telegram
groq.api.key=${GROQ_KEY}
telegram.bot.token=${TELEGRAM_TOKEN}

# Puerto para Render
server.port=${PORT:8080}