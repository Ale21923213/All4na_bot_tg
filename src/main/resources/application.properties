# URL limpia
spring.datasource.url=jdbc:postgresql://ep-cool-wind-apqfs6tm-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

# Credenciales separadas que Render llenar\u00E1
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# Para que las tablas se creen autom\u00E1ticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Marcadores de IA y Telegram
groq.api.key=${GROQ_KEY}
telegram.bot.token=${TELEGRAM_TOKEN}

# Puerto
server.port=${PORT:8080}